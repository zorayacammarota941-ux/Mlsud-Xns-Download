name: Build macOS DMGs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
            filename: Mlsud-Xns_1.0.0_macOS_Apple-Silicon.dmg
          - target: x86_64-apple-darwin
            label: Intel
            filename: Mlsud-Xns_1.0.0_macOS_Intel.dmg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
          workspaces: . -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download architecture-specific resources
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build DMG
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Verify and rename DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.target }}/release/bundle"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          test -n "$dmg_path"
          hdiutil verify "$dmg_path"

          main_binary="target/${{ matrix.target }}/release/clash-verge"
          test -f "$main_binary"
          binary_archs="$(lipo -archs "$main_binary")"
          echo "Main binary architectures: $binary_archs"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) echo "$binary_archs" | grep -qw arm64 ;;
            x86_64-apple-darwin) echo "$binary_archs" | grep -qw x86_64 ;;
          esac

          mkdir -p release-assets
          cp "$dmg_path" "release-assets/${{ matrix.filename }}"
          shasum -a 256 "release-assets/${{ matrix.filename }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.target }}
          path: release-assets/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish v1.0.0
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download both DMGs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.0.0"
          notes=$'Mlsud Xns 1.0.0\n\n- Apple Silicon：适用于 Apple M 系列芯片\n- Intel：适用于 Intel 处理器的 Mac\n\n本构建未经过 Apple Developer ID 公证，首次打开时可能需要在系统设置的“隐私与安全性”中允许。'

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "${{ github.sha }}" \
              --title "Mlsud Xns v1.0.0" \
              --notes "$notes"
          fi
